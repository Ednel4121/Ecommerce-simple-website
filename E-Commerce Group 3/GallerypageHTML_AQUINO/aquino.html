<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Shoes</title>
    <!-- Link to external CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header with navigation bar -->
    <header>
        <nav>
            <h1>Nike Shoes</h1>
            <ul>
                <!-- Navigation links to other pages and categories -->
                <li><a href="../HomepageHTML_Arancillo/homepage_Arancillo.html">Home</a></li>
                <li><a href="../BlogpageHTML_Iloilo/blogpage_Iloilo.html">Blog</a></li>
                <li><a href="#running">Running</a></li>
                <li><a href="#basketball">Basketball</a></li>
                <li><a href="#lifestyle">Lifestyle</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Running Shoes Section -->
        <section id="running" class="product-category">
            <h2>Running Shoes</h2>
            <div class="product-list">
                <div class="product-item">
                    <!-- Product image and details -->
                    <img src="nike pegasus.jpg" alt="Nike Air Zoom Pegasus">
                    <p>Nike Air Zoom Pegasus</p>
                    <button>View Details</button>
                </div>
                <div class="product-item">
                    <img src="nike react infinity.jpg">
                    <p>Nike React Infinity Run</p>
                    <button>View Details</button>
                </div>
            </div>
        </section>

        <!-- Basketball Shoes Section -->
        <section id="basketball" class="product-category">
            <h2>Basketball Shoes</h2>
            <div class="product-list">
                <div class="product-item">
                    <img src="nike lebron 18.jpg" alt="Nike Lebron 18">
                    <p>Nike Lebron 18 </p>
                    <button>View Details</button>
                </div>
                <div class="product-item">
                    <img src="giannis antetokounmp.jpg" alt="Nike Giannis Antetokounmpo">
                    <p>Nike Giannis Antetokounmpo</p>
                    <button>View Details</button>
                </div>
            </div>
        </section>

        <!-- Lifestyle Shoes Section -->
        <section id="lifestyle" class="product-category">
            <h2>Lifestyle Shoes</h2>
            <div class="product-list">
                <div class="product-item">
                    <img src="nike air force 1.jpg" alt="Nike Air Force 1">
                    <p>Nike Air Force 1</p>
                    <button>View Details</button>
                </div>
                <div class="product-item">
                    <img src="nike air max 270.jpg" alt="Nike Air Max 270">
                    <p>Nike Air Max 270</p>
                    <button>View Details</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer with copyright -->
    <footer>
        <p>&copy; 2025 Nike, Inc. All Rights Reserved.</p>
    </footer>

</body>
</html>
